# Disable H2 console
spring.h2.console.enabled=false
# Exclude H2 auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration
# MySQL Configuration
spring.datasource.username=springadmin
spring.datasource.password=password
spring.datasource.url=jdbc:mysql://localhost:3307/springdb?useUnicode=true&encoding=UTF-8&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
# Explicitly set database platform (optional but good)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Connection pool settings
# Pool name for logs
spring.datasource.hikari.pool-name=SpringRest
# Max connections in pool
spring.datasource.hikari.connection-timeout=30000
# Max connections in pool
spring.datasource.hikari.maximum-pool-size=10
# Min idle connections
spring.datasource.hikari.minimum-idle=5
# Max idle time (ms)
spring.datasource.hikari.idle-timeout=600000
# Max connection lifetime (ms)
spring.datasource.hikari.max-lifetime=1800000
# Auto-commit transactions
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
# Enables the caching of prepared statements by the JDBC driver. This is recommended to be set to true to improve performance.
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
# Sets the number of prepared statements that the driver will cache per connection. A common recommendation is between 250-500, with your value of 250 being within this range.
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
# Sets the maximum length of an SQL statement that the driver will cache. The value 2048 is a recommended setting because ORM frameworks like Hibernate can generate longer statements that might exceed the default limits.
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
# For newer database versions that support server-side prepared statements (e.g., MySQL 5.1+), setting this to true provides a substantial performance boost.
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
# This property controls whether the driver uses a local session state. Setting it to true can be necessary for certain configurations, but generally, Hikari defaults work well.
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
# When performing batch updates, setting this to true allows the driver to rewrite the statements into a more efficient, single multi-value insert statement, which improves performance.
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
# Caches result set metadata. Enabling this can improve performance by avoiding repeated metadata lookups.
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
# Caches server configuration properties. This can help reduce the overhead of repeatedly fetching server settings.
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
# Elides (removes) calls to setAutoCommit(true) when it is not necessary, based on the current auto-commit state of the connection. This reduces network traffic and can improve performance.
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
# Used for internal time statistics maintenance within the driver. Setting this to false disables this feature.
spring.datasource.hikari.data-source-properties.maintainTimeStats=false
